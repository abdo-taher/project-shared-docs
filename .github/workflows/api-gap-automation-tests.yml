name: api-gap-automation-tests

on:
  pull_request:
    paths:
      - "automation/**"
      - ".github/workflows/api-gap-*.yml"
  push:
    branches: [main]
    paths:
      - "automation/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s automation/gap/tests -p "test_*.py"
