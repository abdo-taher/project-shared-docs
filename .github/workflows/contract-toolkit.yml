name: contract-toolkit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "examples/**"
      - "api/implemented/**"
      - ".github/workflows/contract-toolkit.yml"

permissions:
  contents: read

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tools/tests -p "test_*.py" -v
      - name: Credential-free consumer setup against the live public repository
        run: |
          set -eu
          work="$(mktemp -d)"
          mkdir -p "$work/tool"
          cp tools/capitalix_contract.py "$work/tool/"
          cd "$work"
          # No GITHUB_TOKEN/GH_TOKEN and a fresh HOME (no gh login): the
          # documented public path must work.
          env -i PATH=/usr/bin:/bin HOME="$work" python3 tool/capitalix_contract.py init
          env -i PATH=/usr/bin:/bin HOME="$work" python3 tool/capitalix_contract.py status
          env -i PATH=/usr/bin:/bin HOME="$work" python3 tool/capitalix_contract.py verify --remote
          env -i PATH=/usr/bin:/bin HOME="$work" python3 tool/capitalix_contract.py inspect customers --method POST owner > /dev/null
          # Gap reading is anonymous too (search lists the public gap issues).
          cp "$GITHUB_WORKSPACE"/tools/capitalix_gap.py "$GITHUB_WORKSPACE"/tools/capitalix_gap_core.py "$work/tool/"
          env -i PATH=/usr/bin:/bin HOME="$work" python3 tool/capitalix_gap.py search --fingerprint 0000000000000000

  reference-consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/dart-owner-customers
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Restore and verify the pinned contract (anonymous, no token)
        id: pin
        run: |
          if [ ! -f .capitalix-contract/contract.lock ]; then
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no contract pinned yet"
            exit 0
          fi
          python3 ../../tools/capitalix_contract.py sync
          python3 ../../tools/capitalix_contract.py verify --remote
          echo "pinned=true" >> "$GITHUB_OUTPUT"
      - name: Fixtures are generated from the pinned contract
        if: steps.pin.outputs.pinned == 'true'
        run: sh tool/fixtures.sh && git diff --exit-code -- test/fixtures
      - name: Analyze and test
        if: steps.pin.outputs.pinned == 'true'
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --exclude-tags backend
      - name: Recorded traffic conforms to the contract
        if: steps.pin.outputs.pinned == 'true'
        run: python3 ../../tools/capitalix_contract.py validate build/traffic-mock.json
      - name: Every API path in lib/ exists in the contract
        if: steps.pin.outputs.pinned == 'true'
        run: python3 ../../tools/capitalix_contract.py check lib/
